[package]
name = "fastrs-core"
version = "0.1.0"
edition = "2024"
description = "A FastAPI-equivalent for Rust: automatic request validation, compile-time OpenAPI docs, and minimal boilerplate on top of Axum, with zero runtime overhead."
license = "MIT OR Apache-2.0"
repository = "https://github.com/mahmudsudo/fast_rs"
readme = "../README.md"
keywords = ["web", "axum", "openapi", "validation", "api"]
categories = ["web-programming", "web-programming::http-server"]

[dependencies]
axum = { version = "0.7", features = ["macros", "multipart"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tower = "0.5"
tower-http = { version = "0.5", features = ["cors", "trace", "request-id", "util"] }
validator = { version = "0.18", features = ["derive"] }
rate_rs = "0.1.0"
uuid = { version = "1", features = ["v4"] }
axum-htmx = { version = "=0.6.0", optional = true }

[features]
default = []
htmx = ["dep:axum-htmx"]
